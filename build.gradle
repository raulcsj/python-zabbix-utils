plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

group = 'io.zabbix4j.api'
version = '1.0.0-SNAPSHOT' // Or a specific version

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    // Apache HttpClient 5
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1' // Check for latest version

    // JSON Processing (Jackson)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2' // Check for latest version

    // Logging (SLF4J API + Logback)
    implementation 'org.slf4j:slf4j-api:2.0.7' // Check for latest version
    runtimeOnly 'ch.qos.logback:logback-classic:1.4.11' // Check for latest version

    // Testing (JUnit 5 & Mockito)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0' // Check for latest version
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0' // Check for latest version
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// Optional: Add a task to generate Javadoc
javadoc {
    options.encoding = 'UTF-8'
    // You can add more options here if needed
}
